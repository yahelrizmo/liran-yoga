<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לירן יוגה — הרשמה</title>
  <meta property="og:title" content="לירן יוגה — הצטרפו אלינו">
  <meta property="og:description" content="בואו לתרגל — בחרו את המנוי המתאים לכם">
  <meta property="og:image" content="https://liran-yoga.netlify.app/liran.jpg">
  <meta property="og:url" content="https://liran-yoga.netlify.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }
    body {
      font-family: 'Heebo', sans-serif;
      color: #4D2115;
      min-height: 100%;
      position: relative;
    }

    /* תמונה ברקע גוללת עם הדף */
    .bg {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 0;
      height: 100%;
      min-height: 100vh;
    }
    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 20, 10, 0.52);
    }

    /* תוכן מרכזי */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.2rem 4rem;
    }

    .logo {
      text-align: center;
      color: white;
      margin-bottom: 2.5rem;
    }
    .logo h1 { font-size: 2.6rem; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
    .logo p { font-size: 1rem; font-weight: 300; opacity: 0.88; margin-top: 0.4rem; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }

    /* כרטיס הטופס */
    .card {
      background: rgba(238, 231, 221, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 2rem 1.8rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    }

    .step-title {
      font-size: 1rem;
      font-weight: 700;
      color: #78855F;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #ede8e0;
    }

    .plans { display: grid; gap: 0.6rem; margin-bottom: 1.5rem; }
    .plan {
      border: 2px solid #ede8e0;
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      transition: border-color 0.2s, background 0.2s;
    }
    .plan:hover { border-color: #78855F; }
    .plan.selected { border-color: #78855F; background: #E8EAE0; }
    .plan-name { font-weight: 600; font-size: 0.95rem; }
    .plan-meta { font-size: 0.78rem; color: #7A6860; margin-top: 0.15rem; }
    .plan-price { font-size: 1.35rem; font-weight: 700; color: #78855F; white-space: nowrap; margin-right: 0.75rem; }

    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.82rem; color: #7A6860; margin-bottom: 0.25rem; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 2px solid #ede8e0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: 'Heebo', sans-serif;
      background: white;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #78855F; }

    .btn {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Heebo', sans-serif;
      transition: background 0.2s;
      margin-top: 1.2rem;
    }
    .btn-main { background: #78855F; color: white; }
    .btn-main:hover { background: #606A4C; }
    .btn-main:disabled { background: #7ab09a; cursor: not-allowed; }
    .btn-green { background: #78855F; color: white; }
    .btn-green:hover { background: #606A4C; }
    .btn-paybox { background: #4D2115; color: white; box-shadow: 0 6px 18px rgba(77,33,21,0.5); }
    .btn-paybox:hover { background: #3A180D; box-shadow: 0 8px 22px rgba(77,33,21,0.6); }
    .pay-methods-note { font-size: 0.88rem; color: #7A6860; margin: 0.4rem 0 1rem; }

    /* תשלום */
    .payment-section { display: none; }
    .payment-section.show { display: block; }

    .pay-box {
      background: white;
      border-radius: 14px;
      border: 2px solid #ede8e0;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .pay-box h3 { color: #78855F; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .pay-amount { font-size: 3rem; font-weight: 700; color: #78855F; margin: 0.5rem 0; }
    .pay-note {
      font-size: 0.83rem;
      color: #7A6860;
      line-height: 1.7;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #ede8e0;
    }
    .copy-field-btn { background: #E8EAE0; color: #4D2115; border: none; border-radius: 6px; padding: 0.25rem 0.65rem; font-family: 'Heebo', sans-serif; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .copy-field-btn:hover { background: #D4D9BF; }

    .msg { padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 0.75rem; font-weight: 600; font-size: 0.88rem; }
    .msg-error { background: #fed7d7; color: #c53030; }
  </style>
</head>
<body>

<div class="bg">
  <img src="liran.jpg" alt="">
</div>

<div class="page">
  <div class="logo">
    <h1 id="biz-name">לירן יוגה</h1>
    <p>הצטרפו לתרגול — בחרו את המנוי המתאים לכם</p>
  </div>

  <div class="card">
    <div id="msg-area"></div>

    <!-- שלב 1+2: בחירת מנוי + פרטים -->
    <div id="step-register">
      <div class="step-title">בחרו סוג מנוי</div>
      <div class="plans" id="plans-list"></div>

      <div class="step-title">פרטים אישיים</div>
      <div class="form-group">
        <label>שם מלא *</label>
        <input type="text" id="reg-name" placeholder="שם ומשפחה">
      </div>
      <div class="form-group">
        <label>מספר טלפון *</label>
        <input type="tel" id="reg-phone" placeholder="05X-XXXXXXX">
      </div>
      <div class="form-group">
        <label>אימייל (אופציונלי)</label>
        <input type="email" id="reg-email" placeholder="mail@example.com">
      </div>
      <button class="btn btn-main" id="submit-btn" onclick="submitRegistration()">המשך לתשלום</button>
    </div>

    <!-- שלב 3: תשלום -->
    <div class="payment-section" id="payment-section">
      <div class="pay-box">
        <h3>תשלום</h3>
        <div class="pay-amount">₪<span id="pay-amount"></span></div>
        <div class="pay-methods-note" id="pay-methods-note"></div>
        <button onclick="openPaybox()" class="btn btn-paybox" style="margin-top:0.25rem">פתחו את Paybox לתשלום</button>
        <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid #ede8e0">
          <div style="font-size:0.82rem;color:#7A6860;margin-bottom:0.6rem">העברה בנקאית — פרטי חשבון:</div>
          <div style="background:#EEE7DD;border-radius:10px;padding:0.75rem 1rem;font-size:0.88rem;color:#4D2115">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0;border-bottom:1px solid #ede8e0"><span id="bank-name-label">בנק מרכנתיל</span><button class="copy-field-btn" id="bank-code-btn" onclick="copyBank(this,'code')">17</button></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0;border-bottom:1px solid #ede8e0"><span>סניף</span><button class="copy-field-btn" id="bank-branch-btn" onclick="copyBank(this,'branch')">725</button></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0;border-bottom:1px solid #ede8e0"><span>מספר חשבון</span><button class="copy-field-btn" id="bank-account-btn" onclick="copyBank(this,'account')">82391574</button></div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0"><span>ע"ש</span><button class="copy-field-btn" id="bank-holder-btn" onclick="copyBank(this,'holder')">עובד לירן</button></div>
          </div>
        </div>
        <div class="pay-note">לאחר ביצוע התשלום — לחצו על הכפתור למטה.</div>
      </div>
      <button class="btn btn-green" onclick="confirmSent()">שלחתי את התשלום ✓</button>
    </div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const db = createClient(
    'https://eznhndwhredmyokwrddd.supabase.co',
    'sb_publishable_gljYa-F3UBsaPkFrbmwXpA_8aBCO36T'
  );

  let selectedPlan = null;
  let pendingClientId = null;
  let bank = { name: 'בנק מרכנתיל', code: '17', branch: '725', account: '82391574', holder: 'עובד לירן' };
  let payboxLink = 'https://links.payboxapp.com/Vrw4qWEvQ2b';

  // מקור אמת יחיד לשיטות התשלום המוצגות ללקוחה — עדכנו כאן (המשפט מתחת לסכום נבנה מהרשימה הזו אוטומטית)
  const PAY_METHODS = ['פייבוקס', 'העברה בנקאית'];

  function renderPayMethodsNote() {
    const el = document.getElementById('pay-methods-note');
    if (!el) return;
    if (!PAY_METHODS.length) { el.textContent = ''; return; }
    const text = PAY_METHODS.length === 1
      ? PAY_METHODS[0]
      : PAY_METHODS.slice(0, -1).join(', ') + ' או ' + PAY_METHODS[PAY_METHODS.length - 1];
    el.textContent = `ניתן לשלם באמצעות ${text}`;
  }
  renderPayMethodsNote();

  async function loadSiteSettings() {
    const { data } = await db.from('site_settings').select('key, value');
    const map = Object.fromEntries((data || []).map(r => [r.key, r.value]));
    if (map.business_name) document.getElementById('biz-name').textContent = map.business_name;
    if (map.paybox_link) payboxLink = map.paybox_link;
    if (map.bank_name) { bank.name = map.bank_name; document.getElementById('bank-name-label').textContent = bank.name; }
    if (map.bank_code) { bank.code = map.bank_code; document.getElementById('bank-code-btn').textContent = bank.code; }
    if (map.bank_branch) { bank.branch = map.bank_branch; document.getElementById('bank-branch-btn').textContent = bank.branch; }
    if (map.bank_account) { bank.account = map.bank_account; document.getElementById('bank-account-btn').textContent = bank.account; }
    if (map.bank_holder) { bank.holder = map.bank_holder; document.getElementById('bank-holder-btn').textContent = bank.holder; }
  }
  loadSiteSettings();

  async function loadPlans() {
    const { data } = await db.from('subscription_types').select('*').eq('is_active', true);
    document.getElementById('plans-list').innerHTML = data?.map(p => `
      <div class="plan" onclick="selectPlan(this, ${p.id}, ${p.price}, '${p.name.replace(/'/g,"\\'")}', ${p.classes_count}, ${p.validity_days})">
        <div>
          <div class="plan-name">${p.name}</div>
          <div class="plan-meta">${p.classes_count} תרגול${p.classes_count > 1 ? 'ים' : ''} · תוקף ${p.validity_days} ימים</div>
        </div>
        <div class="plan-price">₪${p.price}</div>
      </div>
    `).join('');
  }

  function selectPlan(el, id, price, name, classes, days) {
    document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    selectedPlan = { id, price, name, classes, days };
  }

  function showMsg(text) {
    document.getElementById('msg-area').innerHTML = `<div class="msg msg-error">${text}</div>`;
    setTimeout(() => document.getElementById('msg-area').innerHTML = '', 4000);
  }

  async function submitRegistration() {
    if (!selectedPlan) return showMsg('נא לבחור סוג מנוי');
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    if (!name || !phone) return showMsg('נא למלא שם וטלפון');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'שומרת...';

    let clientId;
    const { data: existing } = await db.from('clients').select('id').eq('phone', phone).maybeSingle();
    if (existing) {
      clientId = existing.id;
    } else {
      const { data: newClient, error } = await db.from('clients').insert({ full_name: name, phone, email: email || null }).select().single();
      if (error) { btn.disabled = false; btn.textContent = 'המשך לתשלום'; return showMsg('שגיאה, נסו שוב'); }
      clientId = newClient.id;
    }

    pendingClientId = clientId;

    document.getElementById('step-register').style.display = 'none';
    document.getElementById('pay-amount').textContent = selectedPlan.price;
    document.getElementById('payment-section').classList.add('show');
  }

  function openPaybox() {
    window.location.href = payboxLink;
  }

  function copyBank(btn, field) {
    copyField(btn, bank[field]);
  }

  function copyField(btn, value) {
    navigator.clipboard.writeText(value).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✓';
      btn.style.background = '#78855F';
      btn.style.color = 'white';
      setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 2000);
    });
  }

  async function confirmSent() {
    const start = new Date();
    const expiry = new Date(start);
    expiry.setDate(expiry.getDate() + selectedPlan.days);
    await db.from('subscriptions').update({ is_active: false }).eq('client_id', pendingClientId).eq('is_active', true);
    await db.from('subscriptions').insert({
      client_id: pendingClientId,
      subscription_type_id: selectedPlan.id,
      classes_remaining: selectedPlan.classes,
      start_date: start.toISOString().split('T')[0],
      expiry_date: expiry.toISOString().split('T')[0],
      is_active: true
    });
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    window.location.href = `thank-you.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
  }

  loadPlans();
</script>
</body>
</html>
